name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      # No eslint, ruff, mypy, or tsc project is in this tree. Remotion's
      # `tsc --noEmit` lives in the starter kit and is not run here.
      # These are the checks the repo already supports. None of them render.
      - name: Lint
        run: |
          python3 -m compileall -q scripts templates hyperframes-example manim-example
          python3 -c '
          import json, pathlib, sys
          skip = {".git", "node_modules", ".venv", "__pycache__"}
          bad = []
          for path in pathlib.Path(".").rglob("*.json"):
              if skip.intersection(path.parts):
                  continue
              try:
                  json.loads(path.read_text())
              except Exception as exc:
                  bad.append(f"{path}: {exc}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          '

      - name: Typecheck
        run: python3 scripts/brand.py validate brand/sample-brand.json

      - name: Build
        run: |
          python3 scripts/reelsmith.py list
          python3 scripts/openmotion_preflight.py openmotion-example

      - name: Test
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python3 -m pip install pytest numpy scipy 'opencv-python>=4.10,<5' pysubs2
          python3 -m pytest scripts/test_validate_music_license.py scripts/test_compare_look.py scripts/test_cut_detection.py scripts/test_beat_lock.py scripts/test_motion_audit.py scripts/test_openmotion_preflight.py scripts/test_auto_audit.py scripts/test_audit_warn_sh.py scripts/test_sync_drift.py scripts/test_doctor.py scripts/test_capabilities_menu.py scripts/test_clipping.py scripts/test_version_check.py scripts/test_readme_version.py scripts/test_stream_highlights.py scripts/test_opencv_version.py scripts/test_craft_techniques.py scripts/test_safe_zones.py scripts/test_safe_layout_captions.py scripts/test_safe_layout_integration.py scripts/test_safe_layout_rendering.py scripts/test_caption_bottom_edge.py scripts/test_frame0_real_clips.py scripts/test_frame0_darkening_calibration.py scripts/test_finish_pass_flag.py scripts/test_sfx_cues.py scripts/test_finish_pass_loudness.py scripts/test_finish_pass_dof_bloom.py -v

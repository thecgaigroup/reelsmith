<!doctype html>
<html lang="en" data-resolution="landscape">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="assets/gsap.min.js"></script>
<script src="assets/lottie.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:#0b0f1a; }
#root { width:100%; height:100%; position:relative; font-family:"DejaVu Sans", Arial, sans-serif; }
#anim { position:absolute; left:704px; top:200px; width:512px; height:512px; }
.title { position:absolute; left:0; right:0; top:780px; text-align:center; color:#fff; font-size:72px; font-weight:800; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">
  <div id="anim" class="clip" data-start="0" data-duration="4" data-track-index="0"></div>
  <div id="title" class="clip title" data-start="0" data-duration="4" data-track-index="1">Lottie, frame-accurate</div>
</div>
<script>
// Lottie: autoplay off; the HyperFrames lottie adapter seeks every registered animation per frame.
const anim = lottie.loadAnimation({ container: document.getElementById("anim"), renderer: "svg", loop: true, autoplay: false, path: "assets/pulse.json" });
(window.__hfLottie = window.__hfLottie || []).push(anim);
const tl = gsap.timeline({ paused: true });
tl.from("#title", { y: 40, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.3);
window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body>
</html>
